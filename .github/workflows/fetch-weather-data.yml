name: Fetch Weather Data from ThingSpeak
# Automatically fetches data from ThingSpeak every 5 minutes
# Also allows manual trigger via GitHub Actions UI

on:
  workflow_dispatch:
    # Manual trigger only - DISABLED in favor of collect-data.yml which also updates the index

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Fetch data from ThingSpeak
        env:
          ESCOLA1_CHANNEL_ID: ${{ secrets.ESCOLA1_CHANNEL_ID }}
          ESCOLA1_API_KEY: ${{ secrets.ESCOLA1_API_KEY }}
          ESCOLA2_CHANNEL_ID: ${{ secrets.ESCOLA2_CHANNEL_ID }}
          ESCOLA2_API_KEY: ${{ secrets.ESCOLA2_API_KEY }}
          ESCOLA3_CHANNEL_ID: ${{ secrets.ESCOLA3_CHANNEL_ID }}
          ESCOLA3_API_KEY: ${{ secrets.ESCOLA3_API_KEY }}
          ESCOLA4_CHANNEL_ID: ${{ secrets.ESCOLA4_CHANNEL_ID }}
          ESCOLA4_API_KEY: ${{ secrets.ESCOLA4_API_KEY }}
          ESCOLA5_CHANNEL_ID: ${{ secrets.ESCOLA5_CHANNEL_ID }}
          ESCOLA5_API_KEY: ${{ secrets.ESCOLA5_API_KEY }}
          ESCOLA6_CHANNEL_ID: ${{ secrets.ESCOLA6_CHANNEL_ID }}
          ESCOLA6_API_KEY: ${{ secrets.ESCOLA6_API_KEY }}
        run: node scripts/collect-data.js
      
      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[AUTO] Weather data update - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "[OK] Data updated"
          fi
